<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>shaskell</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app">
      <section class="pane editor-pane">
        <header class="pane-header">
          <h1>shaskell</h1>
          <div class="controls">
            <button id="reset" type="button" class="btn">Reset</button>
            <button id="run" type="button" class="btn">Run</button>
          </div>
        </header>
        <textarea id="editor" spellcheck="false" autocomplete="off">-- shaskell: a functional shader language for images
--   input ramps red left->right and green top->bottom
--   uv is the normalized pixel coordinate, c is its color
--   this posterizes each color channel into a few flat levels
levels = 3
quantize = \(uv, c) -> round (c * levels) / levels
input |> mapPx quantize
</textarea>
        <pre id="log" class="log" aria-live="polite"></pre>
      </section>
      <section class="pane preview-pane">
        <header class="pane-header">
          <h2>output</h2>
        </header>
        <div class="canvas-wrap">
          <canvas id="output"></canvas>
        </div>
      </section>
    </main>
    <script type="module" src="src/main.js"></script>
  </body>
</html>
