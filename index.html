<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>shaskell</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app">
      <section class="pane editor-pane">
        <header class="pane-header">
          <h1>shaskell</h1>
          <div class="controls">
            <select id="input" class="select" title="input image"></select>
            <select id="example" class="select" title="load an example"></select>
            <button id="add" type="button" class="btn">Add cell</button>
            <button id="export" type="button" class="btn">Export</button>
            <button id="import" type="button" class="btn">Import</button>
            <button id="reset" type="button" class="btn">Reset</button>
          </div>
        </header>
        <div id="cells" class="cells"></div>
        <input id="import-file" type="file" accept="application/json,.json" hidden />
        <input id="upload-file" type="file" accept="image/*" hidden />
      </section>
      <section class="pane preview-pane">
        <header class="pane-header">
          <h2>output</h2>
        </header>
        <div class="canvas-wrap">
          <canvas id="output"></canvas>
        </div>
        <pre id="log" class="log" aria-live="polite"></pre>
      </section>
    </main>
    <script type="module" src="src/main.js"></script>
  </body>
</html>
